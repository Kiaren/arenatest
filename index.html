<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arena of Magic and Might</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="lobby"></div>
  <div id="match" class="hidden">
    <div id="stage">
      <canvas id="arena"></canvas>
      <div id="unit-frames"></div>
      <div id="match-info">
        <div id="clock">0:00</div>
        <div id="damp">Healing Reducing 0%</div>
        <div id="phase-label">Prepare</div>
      </div>
      <button type="button" id="leave-training" class="text-btn hidden">Back to lobby</button>
      <div id="actionbar">
        <div id="bar-scale">
          <div id="status-line"></div>
          <div id="castbar" class="hidden">
            <div id="cast-fill"></div>
            <span id="cast-label"></span>
          </div>
          <div id="abilities"></div>
        </div>
        <span id="bar-resize" class="resize-grip" role="slider" aria-label="Action bar size" aria-valuemin="70" aria-valuemax="180" aria-valuenow="100" title="Drag right or up to resize the action bar. Double-click to reset."></span>
        <div id="hint">WASD move · Space jump · right-drag orbit · wheel zoom · drag a unit frame to move it · drag a gold corner to resize · ground aim then click</div>
      </div>
      <div id="log"></div>
      <div id="announce"></div>
      <div id="result" class="hidden"></div>
    </div>
  </div>
  <div id="tooltip" class="hidden"></div>
  <button type="button" id="sound-toggle" aria-pressed="true">Sound on</button>
  <script src="three.min.js"></script>
  <script src="assets/gltf-loader.js"></script>
  <script src="assets/cast.js"></script>
  <script src="assets/fighters.js"></script>
  <script src="arena3d.js"></script>
  <script src="net.js"></script>
  <script src="assets/sfx.js"></script>
  <script src="game.js"></script>
</body>
</html>
